        ''off'') and state_attr(wakeup_entity, ''current'') | int(0) == 0 %} {{ ''on''
        if other_disabled or door_condition else ''off'' }}

        '
      states:
        'on':
          type: custom:vertical-stack-in-card
          cards:
          - type: custom:mushroom-template-card
            primary: "{% set door = 'automation.door_automation' %} {% set wake =\
              \ 'automation.workday_wakeup' %} {% set disabled = states.automation\
              \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id') |\
              \ list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
              \ | int(0) > 0 %}\n  {% set disabled_count = disabled | reject('eq',\
              \ door) | list | length %}\n{% else %}\n  {% set disabled_count = disabled\
              \ | length %}\n{% endif %}\n{% if disabled_count > 0 %}\n  {{ disabled_count\
              \ }} Disabled Automation{{ 's' if disabled_count > 1 else '' }}\n{%\
              \ else %}\n  All Automations Active\n{% endif %}"
            icon: "{% set door = 'automation.door_automation' %} {% set wake = 'automation.workday_wakeup'\
              \ %} {% set disabled = states.automation | selectattr('state', 'eq',\
              \ 'off') | map(attribute='entity_id') | list %} {% if is_state(door,\
              \ 'off') and state_attr(wake, 'current') | int(0) > 0 %}\n  {% set disabled_count\
              \ = disabled | reject('eq', door) | list | length %}\n{% else %}\n \
              \ {% set disabled_count = disabled | length %}\n{% endif %}\n{% if disabled_count\
              \ > 0 %}\n  mdi:robot-off\n{% else %}\n  mdi:robot\n{% endif %}"
            icon_color: "{% set door = 'automation.door_automation' %} {% set wake\
