          \  if (sun.state === 'below_horizon') {\n    sundown = true;\n  } else {\n\
          \    const minutesUntilSunset =\n      (nextSetting - now) / 60000;\n\n\
          \    const previousSunrise =\n      new Date(nextRising.getTime() - (24\
          \ * 60 * 60 * 1000));\n\n    const minutesSinceSunrise =\n      (now - previousSunrise)\
          \ / 60000;\n\n    sundown =\n      minutesUntilSunset <= 60 ||\n      minutesSinceSunrise\
          \ <= 30;\n  }\n\n  const shouldBeOn =\n    sundown ||\n    (home && clouds\
          \ > 40);\n\n  return `\n    <ha-icon\n      icon=\"${shouldBeOn ? 'mdi:check-circle'\
          \ : 'mdi:close-circle'}\"\n      style=\"\n        width: 20px;\n      \
          \  height: 20px;\n        color: ${\n          shouldBeOn\n            ?\
