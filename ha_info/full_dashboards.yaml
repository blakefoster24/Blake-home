

########################################
# DASHBOARD: lovelace_dashboards
########################################
version: 1
minor_version: 1
key: lovelace_dashboards
data:
  items:
  - id: my_dashboard
    show_in_sidebar: true
    title: Phone
    require_admin: false
    mode: storage
    url_path: my-dashboard
    icon: mdi:phone
  - id: test_dashboard
    show_in_sidebar: true
    title: Floorplan
    require_admin: false
    mode: storage
    url_path: test-dashboard


########################################
# DASHBOARD: lovelace.test_dashboard
########################################
views:
- type: panel
  path: ''
  cards:
  - type: picture-elements
    elements:
    - type: conditional
      title: Bedroom lamp on
      conditions:
      - condition: state
        entity: light.bedroom_lamp
        state: 'on'
      - condition: state
        entity: light.bedroom_ceiling_lights
        state: 'off'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/b476b50c090d1d9ea17c0e288079ce59
          media_content_type: image/png
          metadata:
            title: B lamp.png
            thumbnail: /api/image/serve/b476b50c090d1d9ea17c0e288079ce59/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Bedroom: ceiling and lamp'
      conditions:
      - condition: state
        entity: light.bedroom_ceiling_lights
        state: 'on'
      - condition: state
        entity: light.bedroom_lamp
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/a85a86367c4301ab5f35984a02fa8f7a
          media_content_type: image/png
          metadata:
            title: b lamp and ceiling.png
            thumbnail: /api/image/serve/a85a86367c4301ab5f35984a02fa8f7a/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Closet light on
      conditions:
      - condition: state
        entity: light.closet_light
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/188232c166fc63a4897ad72a3120c88a
          media_content_type: image/png
          metadata:
            title: closet ceiling.png
            thumbnail: /api/image/serve/188232c166fc63a4897ad72a3120c88a/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Bathroom light on
      conditions:
      - condition: state
        entity: light.bathroom_light
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/9681f9f01840d7fc83d092046f217735
          media_content_type: image/png
          metadata:
            title: bathroom ceiling.png
            thumbnail: /api/image/serve/9681f9f01840d7fc83d092046f217735/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: main area lamp only
      conditions:
      - condition: state
        entity: light.living_room_lamp
        state: 'on'
      - condition: state
        entity: light.main_lights
        state: 'off'
      - condition: state
        entity: light.living_room_ceiling_lights
        state: 'off'
      - condition: state
        entity: light.kitchen_lights
        state: 'off'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/9ff01dc209d3bf984208333350ef43ab
          media_content_type: image/png
          metadata:
            title: L lamp.png
            thumbnail: /api/image/serve/9ff01dc209d3bf984208333350ef43ab/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Any main area ceiling light and lamp '
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity: light.living_room_lamp
          state: 'on'
        - condition: or
          conditions:
          - condition: state
            entity: light.main_lights
            state: 'on'
          - condition: state
            entity: light.kitchen_lights
            state: 'on'
          - condition: state
            entity: light.living_room_ceiling_lights
            state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/f788812ede304730ff3b5dd9a33a9c3d
          media_content_type: image/png
          metadata:
            title: L lamp and ceiling.png
            thumbnail: /api/image/serve/f788812ede304730ff3b5dd9a33a9c3d/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Any main area ceiling light and not lamp '
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity: light.living_room_lamp
          state: 'off'
        - condition: or
          conditions:
          - condition: state
            entity: light.main_lights
            state: 'on'
          - condition: state
            entity: light.kitchen_lights
            state: 'on'
          - condition: state
            entity: light.living_room_ceiling_lights
            state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/721a4c5f8b4b775c28c76b0952fe6a7e
          media_content_type: image/png
          metadata:
            title: main ceiling on.png
            thumbnail: /api/image/serve/721a4c5f8b4b775c28c76b0952fe6a7e/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Main lights - bathroom closet area
      conditions:
      - condition: state
        entity: light.main_lights
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/a3632a74e822aa779547c9ce0ed38d9c
          media_content_type: image/png
          metadata:
            title: closetbathroomlaundry on.png
            thumbnail: /api/image/serve/a3632a74e822aa779547c9ce0ed38d9c/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    image:
      media_content_id: media-source://image_upload/a74056b155f4916098446f0e595bb59b
      media_content_type: image/png
      metadata:
        title: none.png
        thumbnail: /api/image/serve/a74056b155f4916098446f0e595bb59b/256x256
        media_class: image
        navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://image_upload


########################################
# DASHBOARD: lovelace.my_dashboard
########################################
views:
- title: Home
  badges:
  - type: custom:mod-card
    visibility:
    - condition: state
      entity: light.kitchen_lights
      state_not: 'on'
    - condition: state
      entity: light.bathroom_light
      state_not: 'on'
    - condition: state
      entity: light.main_lights
      state_not: 'on'
    - condition: state
      entity: light.closet_light
      state_not: 'on'
    - condition: state
      entity: light.bedroom_lamp
      state_not: 'on'
    - condition: state
      entity: light.living_room_lamp
      state_not: 'on'
    - condition: state
      entity: light.living_room_ceiling_lights
      state_not: 'on'
    - condition: state
      entity: light.bedroom_tv_backlight
      state_not: 'on'
    - condition: state
      entity: light.bedroom_ceiling_lights
      state_not: 'on'
    - condition: state
      entity: fan.bedroom_fan
      state_not: 'on'
    - condition: state
      entity: fan.bedroom_ceiling_fan
      state_not: 'on'
    - condition: state
      entity: fan.living_room_ceiling_fan
      state_not: 'on'
    - condition: state
      entity: media_player.bedroom_tv
      state_not: 'on'
    - condition: state
      entity: sensor.recent_alexa
      state: none
    - condition: state
      entity: binary_sensor.apartment_presence
      state_not: 'on'
    - condition: state
      entity: person.blake_foster
      state_not: home
    card:
      type: custom:mushroom-template-badge
      icon: mdi:home-off
      content: Away Mode
      color: var(--custom-active)
    card_mod:
      style:
        .: "ha-card {\n  --ha-card-box-shadow: none !important;\n}\n"
        mushroom-template-badge$: ".badge {\n  background: var(--custom-bg) !important;\n\
          }\n"
  definitions:
  - card_mod:
      style: "ha-card {\n  border: none;\n  background: none !important;\n}\nha-card::before\
        \ {\n  content: none !important;\n}\n"
  sections:
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#helper'
      button_type: switch
      sub_button:
        main: []
        bottom: []
      slider_fill_orientation: left
      slider_value_position: right
      name: Current Helpers
      button_action: {}
      icon: mdi:tools
      show_header: true
      bg_opacity: '50'
      bg_blur: '30'
      cards:
      - type: tile
        entity: input_datetime.home_timestamp
        grid_options:
          columns: full
      - type: tile
        entity: input_datetime.last_door_open
        grid_options:
          columns: full
      - type: tile
        entity: sensor.recent_alexa
        grid_options:
          columns: full
      - type: tile
        entity: input_boolean.phone_active
      - type: tile
        entity: input_boolean.disable_toggle
        name: Music Disable
        vertical: false
        features_position: bottom
      hide_backdrop: true
      styles: ".bubble-button-background {\n  background: var(--custom-bg) !important;\n\
        \  opacity: 1 !important;\n}\n.bubble-close-button {\n  background-color:\
        \ var(--custom-bg) !important;\n  opacity: 1 !important;\n}\n.bubble-icon-container\
        \ {\n  background-color: var(--custom-bg) !important;\n  opacity: 1 !important;\n\
        }"
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#nav'
      button_type: switch
      sub_button:
        main: []
        bottom: []
      slider_fill_orientation: left
      slider_value_position: right
      name: Navigate
      button_action: {}
      icon: mdi:navigation-variant
      show_header: true
      bg_opacity: '50'
      bg_blur: '30'
      cards:
      - type: grid
        cards:
        - show_name: true
          show_icon: true
          type: button
          name: Automations
          tap_action:
            action: navigate
            navigation_path: /config/automation
          icon: mdi:robot
          card_mod:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Scenes
          tap_action:
            action: navigate
            navigation_path: /config/scene
          icon: mdi:palette
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Scripts
          tap_action:
            action: navigate
            navigation_path: /config/script
          icon: mdi:script-text
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Integrations
          tap_action:
            action: navigate
            navigation_path: /config/integrations
          icon: mdi:puzzle
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Entities
          tap_action:
            action: navigate
            navigation_path: /config/entities
          icon: mdi:shape
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Helpers
          tap_action:
            action: navigate
            navigation_path: /config/helpers
          icon: mdi:tools
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Devices
          tap_action:
            action: navigate
            navigation_path: /config/devices
          icon: mdi:devices
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: Activity
          tap_action:
            action: navigate
            navigation_path: /logbook
          icon: mdi:format-list-bulleted
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        - show_name: true
          show_icon: true
          type: button
          name: History
          tap_action:
            action: navigate
            navigation_path: /history
          icon: mdi:chart-box
          uix:
            style: "ha-card {\n  background: var(--custom-popup-card-background, var(--ha-card-background))\
              \ !important;\n}\n"
        grid_options:
          columns: 12
          rows: auto
      - type: tile
        grid_options:
          columns: full
        entity: light.closet_light
        name: Current Helpers
        icon: mdi:tools
        hide_state: true
        vertical: false
        tap_action:
          action: navigate
          navigation_path: '#helper'
        features_position: bottom
        card_mod:
          style: "ha-card {\n  background: var(\n    --custom-popup-card-background,\n\
            \    var(--ha-card-background, var(--card-background-color))\n  ) !important;\n\
            }\n"
      hide_backdrop: true
      styles: ".bubble-button-background {\n  background: var(--custom-bg) !important;\n\
        \  opacity: 1 !important;\n}\n.bubble-close-button {\n  background-color:\
        \ var(--custom-bg) !important;\n  opacity: 1 !important;\n}\n.bubble-icon-container\
        \ {\n  background-color: var(--custom-bg) !important;\n  opacity: 1 !important;\n\
        }"
    - type: custom:bubble-card
      card_type: button
      button_type: name
      sub_button:
        main: []
        bottom: []
      slider_fill_orientation: left
      slider_value_position: right
      name: Navigate
      icon: mdi:navigation-variant
      button_action:
        tap_action:
          action: navigate
          navigation_path: /my-dashboard/home/#nav
      styles: "ha-card {\n  --bubble-button-main-background-color: var(--custom-bg);\n\
        \  --bubble-button-icon-background-color: var(--custom-bg);\n  --bubble-button-border-radius:\
        \ 16px;\n}\n"
    - type: custom:state-switch
      entity: '{{ ''on'' if state_attr(''automation.workday_wakeup'', ''current'')
        | int(0) > 0 else ''off'' }}'
      states:
        'on':
          type: custom:vertical-stack-in-card
          cards:
          - type: custom:mushroom-template-card
            primary: Workday Wakeup is Active
            features_position: bottom
            grid_options:
              columns: full
            icon: local:briefcase_alarm_automation
            icon_color: '#e1b000'
            name_color: '#e1b000'
            uix:
              style: "ha-card {\n  border: none;\n  background: none;\n  margin-bottom:\
                \ -15px;\n}\n\nha-card::before {\n  content: none !important;\n}\n"
          - type: custom:custom-features-card
            features:
            - type: custom:service-call
              entries:
              - type: button
                entity_id: ''
                label: Abort and Reset
                icon: mdi:cancel
                thumb: md3-elevated
                tap_action:
                  action: perform-action
                  perform_action: script.helper_script
                  data:
                    action_type: abort
            uix:
              style: "ha-card {\n  border: none;\n  background: none;\n  box-shadow:\
                \ none;\n}\n\nha-card::before {\n  content: none !important;\n}\n"
    - type: custom:state-switch
      entity: template
      template: '{% set door_entity = ''automation.door_automation'' %} {% set wakeup_entity
        = ''automation.workday_wakeup'' %} {% set other_disabled = states.automation
        | selectattr(''state'', ''eq'', ''off'') | rejectattr(''entity_id'', ''eq'',
        door_entity) | list | count > 0 %} {% set door_condition = is_state(door_entity,
        ''off'') and state_attr(wakeup_entity, ''current'') | int(0) == 0 %} {{ ''on''
        if other_disabled or door_condition else ''off'' }}

        '
      states:
        'on':
          type: custom:vertical-stack-in-card
          cards:
          - type: custom:mushroom-template-card
            primary: "{% set door = 'automation.door_automation' %} {% set wake =\
              \ 'automation.workday_wakeup' %} {% set disabled = states.automation\
              \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id') |\
              \ list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
              \ | int(0) > 0 %}\n  {% set disabled_count = disabled | reject('eq',\
              \ door) | list | length %}\n{% else %}\n  {% set disabled_count = disabled\
              \ | length %}\n{% endif %}\n{% if disabled_count > 0 %}\n  {{ disabled_count\
              \ }} Disabled Automation{{ 's' if disabled_count > 1 else '' }}\n{%\
              \ else %}\n  All Automations Active\n{% endif %}"
            icon: "{% set door = 'automation.door_automation' %} {% set wake = 'automation.workday_wakeup'\
              \ %} {% set disabled = states.automation | selectattr('state', 'eq',\
              \ 'off') | map(attribute='entity_id') | list %} {% if is_state(door,\
              \ 'off') and state_attr(wake, 'current') | int(0) > 0 %}\n  {% set disabled_count\
              \ = disabled | reject('eq', door) | list | length %}\n{% else %}\n \
              \ {% set disabled_count = disabled | length %}\n{% endif %}\n{% if disabled_count\
              \ > 0 %}\n  mdi:robot-off\n{% else %}\n  mdi:robot\n{% endif %}"
            icon_color: "{% set door = 'automation.door_automation' %} {% set wake\
              \ = 'automation.workday_wakeup' %} {% set disabled = states.automation\
              \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id') |\
              \ list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
              \ | int(0) > 0 %}\n  {% set disabled_count = disabled | reject('eq',\
              \ door) | list | length %}\n{% else %}\n  {% set disabled_count = disabled\
              \ | length %}\n{% endif %}\n{% if disabled_count > 0 %}\n  orange\n\
              {% else %}\n  green\n{% endif %}"
            tap_action:
              action: navigate
              navigation_path: /config/automation
            grid_options:
              columns: full
              rows: auto
            uix:
              style: "ha-card {\n  background: none !important;\n  border: none !important;\n\
                \  box-shadow: none !important;\n  margin-bottom: -20px !important;\n\
                }\nha-card::before {\n  content: none !important;\n}\n"
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              uix:
                style: "ha-card {\n  background: none !important;\n  border: none\
                  \ !important;\n  box-shadow: none !important;\n}\nha-card::before\
                  \ {\n  content: none !important;\n}\n"
            filter:
              template: "{% set door = 'automation.door_automation' %} {% set wake\
                \ = 'automation.workday_wakeup' %} {% set disabled = states.automation\
                \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id')\
                \ | list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
                \ | int(0) > 0 %}\n  {{ disabled | reject('eq', door) | list | tojson\
                \ }}\n{% else %}\n  {{ disabled | tojson }}\n{% endif %}"
    - type: custom:state-switch
      entity: "{{ 'on'\n   if state_attr('automation.light_automations', 'current')\
        \ | int(0) > 0\n   and not is_state('timer.timer_helper', 'idle')\n   else\
        \ 'off'\n}}"
      states:
        'on':
          type: tile
          grid_options:
            columns: full
          entity: timer.timer_helper
          name: Light Template Active
          vertical: false
          tap_action:
            action: none
          features_position: bottom
    - type: heading
      icon: mdi:devices
      heading: Devices
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.openweathermap_cloud_coverage_2
        icon: ''
      - type: entity
        show_state: true
        show_icon: true
        entity: sun.sun
      uix:
        style: ".title {\n  font-size: 20px !important;\n}\n.title ha-icon {\n  --mdc-icon-size:\
          \ 20px !important;\n}\n"
    - type: custom:button-card
      entity: light.main_lights
      grid_options:
        rows: 2
        columns: 3
      section_mode: true
      hold_action:
        action: more-info
      size: 40px
      name: Main<br/>Lights
      styles:
        card:
        - font-size: 15px
    - type: custom:button-card
      entity: light.kitchen_lights
      section_mode: true
      grid_options:
        rows: 2
        columns: 3
      hold_action:
        action: more-info
      size: 3rem
      name: Kitchen<br/>Lights
      styles:
        card:
        - font-size: 15px
    - type: custom:button-card
      entity: light.living_room_ceiling_lights
      section_mode: true
      grid_options:
        rows: 2
        columns: 3
      hold_action:
        action: more-info
      size: 4rem
      name: Living Room<br/>Lights
      styles:
        card:
        - font-size: 1rem
    - type: custom:button-card
      entity: light.living_room_lamp
      name: Living Room Lamp
      icon: mdi:floor-lamp
      section_mode: true
      grid_options:
        columns: 3
        rows: 2
      show_name: true
      show_icon: true
      show_state: false
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      custom_fields:
        lamp_status: "[[[\n  const home =\n    states['person.blake_foster']?.state\
          \ === 'home';\n\n  const clouds =\n    Number(states['sensor.openweathermap_cloud_coverage_2']?.state);\n\
          \n  const sun = states['sun.sun'];\n  const now = new Date();\n\n  const\
          \ nextRising = new Date(sun.attributes.next_rising);\n  const nextSetting\
          \ = new Date(sun.attributes.next_setting);\n\n  let sundown = false;\n\n\
          \  if (sun.state === 'below_horizon') {\n    sundown = true;\n  } else {\n\
          \    const minutesUntilSunset =\n      (nextSetting - now) / 60000;\n\n\
          \    const previousSunrise =\n      new Date(nextRising.getTime() - (24\
          \ * 60 * 60 * 1000));\n\n    const minutesSinceSunrise =\n      (now - previousSunrise)\
          \ / 60000;\n\n    sundown =\n      minutesUntilSunset <= 60 ||\n      minutesSinceSunrise\
          \ <= 30;\n  }\n\n  const shouldBeOn =\n    sundown ||\n    (home && clouds\
          \ > 40);\n\n  return `\n    <ha-icon\n      icon=\"${shouldBeOn ? 'mdi:check-circle'\
          \ : 'mdi:close-circle'}\"\n      style=\"\n        width: 20px;\n      \
          \  height: 20px;\n        color: ${\n          shouldBeOn\n            ?\
          \ 'var(--success-color)'\n            : 'var(--error-color)'\n        };\n\
          \      \">\n    </ha-icon>\n  `;\n]]]\n"
