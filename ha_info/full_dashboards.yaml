

########################################
# DASHBOARD: lovelace_dashboards
########################################
version: 1
minor_version: 1
key: lovelace_dashboards
data:
  items:
  - id: my_dashboard
    show_in_sidebar: true
    title: Phone
    require_admin: false
    mode: storage
    url_path: my-dashboard
    icon: mdi:phone
  - id: test_dashboard
    show_in_sidebar: true
    title: Floorplan
    require_admin: false
    mode: storage
    url_path: test-dashboard


########################################
# DASHBOARD: lovelace.test_dashboard
########################################
views:
- type: panel
  path: ''
  cards:
  - type: picture-elements
    elements:
    - type: conditional
      title: Bedroom lamp on
      conditions:
      - condition: state
        entity: light.bedroom_lamp
        state: 'on'
      - condition: state
        entity: light.bedroom_ceiling_lights
        state: 'off'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/b476b50c090d1d9ea17c0e288079ce59
          media_content_type: image/png
          metadata:
            title: B lamp.png
            thumbnail: /api/image/serve/b476b50c090d1d9ea17c0e288079ce59/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Bedroom: ceiling and lamp'
      conditions:
      - condition: state
        entity: light.bedroom_ceiling_lights
        state: 'on'
      - condition: state
        entity: light.bedroom_lamp
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/a85a86367c4301ab5f35984a02fa8f7a
          media_content_type: image/png
          metadata:
            title: b lamp and ceiling.png
            thumbnail: /api/image/serve/a85a86367c4301ab5f35984a02fa8f7a/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Closet light on
      conditions:
      - condition: state
        entity: light.closet_light
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/188232c166fc63a4897ad72a3120c88a
          media_content_type: image/png
          metadata:
            title: closet ceiling.png
            thumbnail: /api/image/serve/188232c166fc63a4897ad72a3120c88a/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Bathroom light on
      conditions:
      - condition: state
        entity: light.bathroom_light
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/9681f9f01840d7fc83d092046f217735
          media_content_type: image/png
          metadata:
            title: bathroom ceiling.png
            thumbnail: /api/image/serve/9681f9f01840d7fc83d092046f217735/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: main area lamp only
      conditions:
      - condition: state
        entity: light.living_room_lamp
        state: 'on'
      - condition: state
        entity: light.main_lights
        state: 'off'
      - condition: state
        entity: light.living_room_ceiling_lights
        state: 'off'
      - condition: state
        entity: light.kitchen_lights
        state: 'off'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/9ff01dc209d3bf984208333350ef43ab
          media_content_type: image/png
          metadata:
            title: L lamp.png
            thumbnail: /api/image/serve/9ff01dc209d3bf984208333350ef43ab/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Any main area ceiling light and lamp '
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity: light.living_room_lamp
          state: 'on'
        - condition: or
          conditions:
          - condition: state
            entity: light.main_lights
            state: 'on'
          - condition: state
            entity: light.kitchen_lights
            state: 'on'
          - condition: state
            entity: light.living_room_ceiling_lights
            state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/f788812ede304730ff3b5dd9a33a9c3d
          media_content_type: image/png
          metadata:
            title: L lamp and ceiling.png
            thumbnail: /api/image/serve/f788812ede304730ff3b5dd9a33a9c3d/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: 'Any main area ceiling light and not lamp '
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity: light.living_room_lamp
          state: 'off'
        - condition: or
          conditions:
          - condition: state
            entity: light.main_lights
            state: 'on'
          - condition: state
            entity: light.kitchen_lights
            state: 'on'
          - condition: state
            entity: light.living_room_ceiling_lights
            state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/721a4c5f8b4b775c28c76b0952fe6a7e
          media_content_type: image/png
          metadata:
            title: main ceiling on.png
            thumbnail: /api/image/serve/721a4c5f8b4b775c28c76b0952fe6a7e/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    - type: conditional
      title: Main lights - bathroom closet area
      conditions:
      - condition: state
        entity: light.main_lights
        state: 'on'
      elements:
      - type: image
        style:
          left: 50%
          top: 50%
          width: 100%
        image:
          media_content_id: media-source://image_upload/a3632a74e822aa779547c9ce0ed38d9c
          media_content_type: image/png
          metadata:
            title: closetbathroomlaundry on.png
            thumbnail: /api/image/serve/a3632a74e822aa779547c9ce0ed38d9c/256x256
            media_class: image
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    image:
      media_content_id: media-source://image_upload/a74056b155f4916098446f0e595bb59b
      media_content_type: image/png
      metadata:
        title: none.png
        thumbnail: /api/image/serve/a74056b155f4916098446f0e595bb59b/256x256
        media_class: image
        navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://image_upload
  background:
    opacity: 40
    alignment: center
    size: cover
    repeat: repeat
    attachment: fixed


########################################
# DASHBOARD: lovelace.my_dashboard
########################################
views:
- background:
    alignment: center
    attachment: fixed
    opacity: 33
    repeat: repeat
    size: cover
  badges:
  - card:
      color: var(--custom-active)
      content: Away Mode
      icon: mdi:home-off
      type: custom:mushroom-template-badge
    card_mod:
      style:
        .: "ha-card {\n  --ha-card-box-shadow: none !important;\n}\n"
        mushroom-template-badge$: ".badge {\n  background: var(--custom-bg) !important;\n\
          }\n"
    type: custom:mod-card
    visibility:
    - condition: state
      entity: light.kitchen_lights
      state_not: 'on'
    - condition: state
      entity: light.bathroom_light
      state_not: 'on'
    - condition: state
      entity: light.main_lights
      state_not: 'on'
    - condition: state
      entity: light.closet_light
      state_not: 'on'
    - condition: state
      entity: light.bedroom_lamp
      state_not: 'on'
    - condition: state
      entity: light.living_room_lamp
      state_not: 'on'
    - condition: state
      entity: light.living_room_ceiling_lights
      state_not: 'on'
    - condition: state
      entity: light.bedroom_tv_backlight
      state_not: 'on'
    - condition: state
      entity: light.bedroom_ceiling_lights
      state_not: 'on'
    - condition: state
      entity: fan.bedroom_fan
      state_not: 'on'
    - condition: state
      entity: fan.bedroom_ceiling_fan
      state_not: 'on'
    - condition: state
      entity: fan.living_room_ceiling_fan
      state_not: 'on'
    - condition: state
      entity: media_player.bedroom_tv
      state_not: 'on'
    - condition: state
      entity: sensor.recent_alexa
      state: none
    - condition: state
      entity: binary_sensor.apartment_presence
      state_not: 'on'
    - condition: state
      entity: person.blake_foster
      state_not: home
  cards: []
  definitions:
  - card_mod:
      style: "ha-card {\n  border: none;\n  background: none !important;\n}\nha-card::before\
        \ {\n  content: none !important;\n}\n"
  dense_section_placement: true
  header:
    badges_position: bottom
    badges_wrap: wrap
    layout: center
  max_columns: 4
  sections:
  - cards:
    - bg_blur: '30'
      bg_opacity: '50'
      button_action: {}
      button_type: switch
      card_type: pop-up
      cards:
      - type: tile
        grid_options:
          columns: full
        entity: input_datetime.home_timestamp
        vertical: false
        tap_action:
          action: none
        features_position: bottom
      - type: tile
        grid_options:
          columns: full
        entity: input_datetime.last_door_open
        vertical: false
        tap_action:
          action: none
        features_position: bottom
      - entity: sensor.recent_alexa
        grid_options:
          columns: full
        type: tile
      - entity: input_boolean.phone_active
        type: tile
      - entity: input_boolean.disable_toggle
        features_position: bottom
        name: Music Disable
        type: tile
        vertical: false
      hash: '#helper'
      hide_backdrop: true
      icon: mdi:tools
      name: Current Helpers
      show_header: true
      slider_fill_orientation: left
      slider_value_position: right
      styles: ".bubble-button-background {\n  background: var(--custom-bg) !important;\n\
        \  opacity: 1 !important;\n}\n.bubble-close-button {\n  background-color:\
        \ var(--custom-bg) !important;\n  opacity: 1 !important;\n}\n.bubble-icon-container\
        \ {\n  background-color: var(--custom-bg) !important;\n  opacity: 1 !important;\n\
        }"
      sub_button:
        bottom: []
        main: []
      type: custom:bubble-card
    - bg_blur: '30'
      bg_opacity: '20'
      button_action: {}
      button_type: switch
      card_type: pop-up
      cards:
      - cards:
        - icon: mdi:robot
          name: Automations
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/automation
          type: button
        - icon: mdi:palette
          name: Scenes
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/scene
          type: button
        - icon: mdi:script-text
          name: Scripts
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/script
          type: button
        - icon: mdi:puzzle
          name: Integrations
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/integrations
          type: button
        - icon: mdi:shape
          name: Entities
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/entities
          type: button
        - icon: mdi:tools
          name: Helpers
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/helpers
          type: button
        - icon: mdi:devices
          name: Devices
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /config/devices
          type: button
        - icon: mdi:format-list-bulleted
          name: Activity
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /logbook
          type: button
        - icon: mdi:chart-box
          name: History
          show_icon: true
          show_name: true
          tap_action:
            action: navigate
            navigation_path: /history
          type: button
        grid_options:
          columns: 12
          rows: auto
        type: grid
      - entity: sensor.blakes_iphone_pressure
        features_position: bottom
        grid_options:
          columns: full
        hide_state: true
        icon: mdi:tools
        name: Helper States
        tap_action:
          action: navigate
          navigation_path: '#helper'
        type: tile
        vertical: false
      - color: white
        entity: binary_sensor.apartment_presence
        features:
        - entries:
          - entity_id: binary_sensor.apartment_presence
            icon: mdi:shield-home
            label: View
            styles: ":host {\n  min-width: 50px !important;\n  min-height: 40px !important;\n\
              \  margin-right: 0px;\n  border: var(--custom-button-border) !important;\n\
              \  border-radius: var(--custom-radius);\n  --color: {{ 'var(--custom-bg)'\
              \ }};\n  box-shadow: none;\n}\n.label {\n  color: {{ 'var(--custom-contrast)'\
              \ }};\n}\n.icon {\n  color: {{ 'var(--custom-contrast)' }};  \n}"
            tap_action:
              action: navigate
              navigation_path: /my-dashboard/security
            thumb: md3-elevated
            type: button
          type: custom:service-call
        features_position: inline
        grid_options:
          columns: 12
          rows: 1
        hide_state: true
        icon: mdi:shield-home
        icon_tap_action:
          action: none
        name: Security Dashboard
        tap_action:
          action: none
        type: tile
        vertical: false
      hash: '#nav'
      hide_backdrop: true
      icon: mdi:navigation-variant
      name: Shortcuts
      show_header: true
      slider_fill_orientation: left
      slider_value_position: right
      styles: ".bubble-button-background {\n  background: var(--custom-bg) !important;\n\
        \  opacity: 1 !important;\n}\n.bubble-close-button {\n  background-color:\
        \ var(--custom-bg) !important;\n  opacity: 1 !important;\n}\n.bubble-icon-container\
        \ {\n  background-color: var(--custom-bg) !important;\n  opacity: 1 !important;\n\
        }"
      sub_button:
        bottom: []
        main: []
      type: custom:bubble-card
    - card_mod:
        style: "ha-card {\n  background: var(--custom-bg) !important;\n}\nha-tile-icon\
          \ {\n  --tile-color: var(--custom-contrast) !important;\n}\n"
      color: primary
      entity: light.bathroom_light
      features_position: bottom
      grid_options:
        columns: full
      hide_state: true
      icon: mdi:navigation-variant
      icon_tap_action:
        action: none
      name: Shortcuts
      tap_action:
        action: navigate
        navigation_path: '#nav'
      type: tile
      vertical: false
    - entity: '{{ ''on'' if state_attr(''automation.workday_wakeup'', ''current'')
        | int(0) > 0 else ''off'' }}'
      states:
        'on':
          cards:
          - features_position: bottom
            grid_options:
              columns: full
            icon: local:briefcase_alarm_automation
            icon_color: '#e1b000'
            name_color: '#e1b000'
            primary: Workday Wakeup is Active
            type: custom:mushroom-template-card
            uix:
              style: "ha-card {\n  border: none;\n  background: none;\n  margin-bottom:\
                \ -15px;\n}\n\nha-card::before {\n  content: none !important;\n}\n"
          - features:
            - entries:
              - entity_id: ''
                icon: mdi:cancel
                label: Abort and Reset
                tap_action:
                  action: perform-action
                  data:
                    action_type: abort
                  perform_action: script.helper_script
                thumb: md3-elevated
                type: button
                styles: ":host {\n  border: var(--custom-button-border) !important;\n\
                  \  border-radius: var(--custom-radius);\n  --color: {{ 'var(--custom-bg)'\
                  \ }};\n}\n.label {\n  color: {{ 'var(--custom-active)' }};\n}\n\
                  .icon {\n  color: {{ 'var(--custom-active)' }};  \n}"
              type: custom:service-call
            type: custom:custom-features-card
            uix:
              style: "ha-card {\n  border: none;\n  background: none;\n  box-shadow:\
                \ none;\n}\n\nha-card::before {\n  content: none !important;\n}\n"
          type: custom:vertical-stack-in-card
      type: custom:state-switch
    - entity: "{{ 'on'\n   if is_state('script.helper_script', 'on')\n   and states('input_text.template_tracking')\
        \ != ''\n   else 'off'\n}}"
      states:
        'on':
          element:
            card_mod:
              style: "ha-tile-info .primary {\n  white-space: normal !important;\n\
                \  overflow: visible !important;\n  text-overflow: unset !important;\n\
                \  line-height: 1.2 !important;\n}\n"
            entity: timer.timer_helper
            features_position: bottom
            hide_state: '{{ states(''input_text.template_tracking'').startswith(''Timer
              was'') }}'
            name: "{% if states('input_text.template_tracking').startswith('Timer\
              \ was') %}\n  Timer was already in use when triggered\n{% else %}\n\
              \  Light Template Active - {{ states('input_text.template_tracking')\
              \ }}\n{% endif %}"
            tap_action:
              action: none
            type: tile
            vertical: false
          forge:
            grid_options:
              columns: full
            mold: card
          type: custom:uix-forge
      type: custom:state-switch
    - entity: template
      states:
        'on':
          cards:
          - grid_options:
              columns: full
              rows: auto
            icon: "{% set door = 'automation.door_automation' %} {% set wake = 'automation.workday_wakeup'\
              \ %} {% set disabled = states.automation | selectattr('state', 'eq',\
              \ 'off') | map(attribute='entity_id') | list %} {% if is_state(door,\
              \ 'off') and state_attr(wake, 'current') | int(0) > 0 %}\n  {% set disabled_count\
              \ = disabled | reject('eq', door) | list | length %}\n{% else %}\n \
              \ {% set disabled_count = disabled | length %}\n{% endif %}\n{% if disabled_count\
              \ > 0 %}\n  mdi:robot-off\n{% else %}\n  mdi:robot\n{% endif %}"
            icon_color: "{% set door = 'automation.door_automation' %} {% set wake\
              \ = 'automation.workday_wakeup' %} {% set disabled = states.automation\
              \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id') |\
              \ list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
              \ | int(0) > 0 %}\n  {% set disabled_count = disabled | reject('eq',\
              \ door) | list | length %}\n{% else %}\n  {% set disabled_count = disabled\
              \ | length %}\n{% endif %}\n{% if disabled_count > 0 %}\n  orange\n\
              {% else %}\n  green\n{% endif %}"
            primary: "{% set door = 'automation.door_automation' %} {% set wake =\
              \ 'automation.workday_wakeup' %} {% set disabled = states.automation\
              \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id') |\
              \ list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
              \ | int(0) > 0 %}\n  {% set disabled_count = disabled | reject('eq',\
              \ door) | list | length %}\n{% else %}\n  {% set disabled_count = disabled\
              \ | length %}\n{% endif %}\n{% if disabled_count > 0 %}\n  {{ disabled_count\
              \ }} Disabled Automation{{ 's' if disabled_count > 1 else '' }}\n{%\
              \ else %}\n  All Automations Active\n{% endif %}"
            tap_action:
              action: navigate
              navigation_path: /config/automation
            type: custom:mushroom-template-card
            uix:
              style: "ha-card {\n  background: none !important;\n  border: none !important;\n\
                \  box-shadow: none !important;\n  margin-bottom: -20px !important;\n\
                }\nha-card::before {\n  content: none !important;\n}\n"
          - card:
              type: entities
              uix:
                style: "ha-card {\n  background: none !important;\n  border: none\
                  \ !important;\n  box-shadow: none !important;\n}\nha-card::before\
                  \ {\n  content: none !important;\n}\n"
            filter:
              template: "{% set door = 'automation.door_automation' %} {% set wake\
                \ = 'automation.workday_wakeup' %} {% set disabled = states.automation\
                \ | selectattr('state', 'eq', 'off') | map(attribute='entity_id')\
                \ | list %} {% if is_state(door, 'off') and state_attr(wake, 'current')\
                \ | int(0) > 0 %}\n  {{ disabled | reject('eq', door) | list | tojson\
                \ }}\n{% else %}\n  {{ disabled | tojson }}\n{% endif %}"
            show_empty: false
            type: custom:auto-entities
          type: custom:vertical-stack-in-card
      template: '{% set door_entity = ''automation.door_automation'' %} {% set wakeup_entity
        = ''automation.workday_wakeup'' %} {% set other_disabled = states.automation
        | selectattr(''state'', ''eq'', ''off'') | rejectattr(''entity_id'', ''eq'',
        door_entity) | list | count > 0 %} {% set door_condition = is_state(door_entity,
        ''off'') and state_attr(wakeup_entity, ''current'') | int(0) == 0 %} {{ ''on''
        if other_disabled or door_condition else ''off'' }}

        '
      type: custom:state-switch
    - cards:
      - color: red
        features_position: bottom
        grid_options:
          columns: full
        icon: mdi:security
        primary: Security Alert!
        secondary: '{{ states(''input_text.security_info'') }}'
        type: custom:mushroom-template-card
        uix:
          style:
            .: "ha-tile-icon {\n  size: 20px !important;\n}\n\nha-card {\n  height:\
              \ auto !important;\n  margin-top: 10px;\n  --icon-display: block !important;\n\
              \  background: none;\n  padding-top: 1px;\n}\n\nha-card::before {\n\
              \  content: none;\n}\n"
            ha-tile-info$: ":host {\n  --ha-tile-info-primary-font-size: 20px;\n \
              \ --ha-tile-info-primary-color: red;\n  --ha-tile-info-secondary-font-size:\
              \ 16px;\n  --ha-tile-info-secondary-line-height: 20px;\n}\n"
      - features:
        - entries:
          - entity_id: ''
            icon: mdi:cancel
            label: Reset
            styles: ":host {\n  height: 30px !important;\n  border: var(--custom-button-border)\
              \ !important;\n  border-radius: var(--custom-radius);\n  --color: {{\
              \ 'var(--custom-bg)' }};\n  box-shadow: none;\n}\n\n.label {\n  color:\
              \ {{ 'var(--custom-contrast)' }};\n}\n\n.icon {\n  color: {{ 'var(--custom-contrast)'\
              \ }};\n}\n"
            tap_action:
              action: perform-action
              data:
                skip_condition: true
                variables:
                  action_type: disregard
