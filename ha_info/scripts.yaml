find_remote:
  sequence:
  - action: remote.send_command
    metadata: {}
    data:
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
      command: find_remote
    target:
      entity_id: remote.bedroom_tv
  alias: Find Remote
  description: ''
find_my_phone:
  alias: Find My Phone
  use_blueprint:
    path: ggoulart/Find My Apple Device.yaml
    input:
      apple_device: f2f0fd38cf7bfe7c575b14a75d8b8413
      apple_account: blake.foster30@gmail.com
  description: ''
temporary_thermostat_adjustment:
  alias: Temporary Thermostat Adjustment
  description: Overrides HVAC Temporarily
  icon: mdi:thermostat-clock
  mode: restart
  fields:
    hvac_mode:
      name: HVAC Mode
      required: false
      selector:
        select:
          options:
          - label: Cool
            value: cool
          - label: Heat
            value: heat
    target_temp:
      name: Target Temperature
      required: false
      selector:
        number:
          min: 60
          max: 85
          step: 1
          unit_of_measurement: °F
          mode: slider
    duration:
      name: Duration (Minutes)
      required: true
      selector:
        number:
          min: 10
          max: 240
          step: 5
          unit_of_measurement: min
          mode: box
      default: 30
  sequence:
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.thermostat_automation_pause
    data: {}
  - action: scene.create
    metadata: {}
    data:
      scene_id: temp_thermostat_snapshot
      snapshot_entities:
      - climate.nest_thermostat
  - action: climate.set_temperature
    metadata: {}
    target:
      entity_id: climate.nest_thermostat
    data:
      hvac_mode: '{{ hvac_mode }}'
      temperature: '{{ target_temp }}'
  - action: timer.start
    metadata: {}
    target:
      entity_id: timer.timer_helper
    data:
      duration: '{{ duration | float(30) * 60 }}'
  - wait_for_trigger:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.timer_helper
    continue_on_timeout: true
    timeout:
      hours: 2
      minutes: 0
      seconds: 0
      milliseconds: 0
  - action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.temp_thermostat_snapshot
  - action: scene.delete
    metadata: {}
    target:
      entity_id: scene.temp_thermostat_snapshot
    data: {}
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.thermostat_automation_pause
    data: {}
push_ha_info_to_github_create_ai_zip_file_now:
  alias: Push Ha Info to GitHub & Create AI Zip File
  description: Generates HA_Overview.md, runs diagnostics, pushes to GitHub, AND creates
    a zip for download.
  mode: single
  trace:
    stored_traces: 10
  sequence:
  - if:
    - condition: template
      value_template: '{{ action_type | default('''') == ''delete_zip'' }}'
      alias: 'Action_type: delete_zip'
    then:
    - action: shell_command.delete_ha_ai_zip
      data: {}
      metadata: {}
    else:
    - action: shell_command.delete_ha_ai_zip
      data: {}
      metadata: {}
    - action: shell_command.write_ha_overview
      data:
        content: "# Home Assistant Configuration\n_Last Updated: {{ now().isoformat()
          }}_\n\n## \U0001F6E0 UI Helpers\nBelow are the input helpers configured
          in Home Assistant.\n\n{% set helpers = ['input_boolean', 'input_button',
          'input_datetime', 'input_number', 'input_select', 'input_text', 'counter',
          'timer', 'schedule'] %}\n{% for domain in helpers %}\n{% set assets = states[domain]
          | list %}\n{% if assets | count > 0 %}\n### {{ domain | replace('input_',
          '') | capitalize }}\n| Entity ID | Name | State | Attributes |\n|---|---|---|---|\n{%
          for s in assets | sort(attribute='entity_id') %}\n{% set details = [] %}\n{%
          if domain == 'input_number' %}\n  {% set details = details + ['min=' ~ s.attributes.get('min',
          'none'), 'max=' ~ s.attributes.get('max', 'none'), 'step=' ~ s.attributes.get('step',
          'none')] %}\n{% elif domain == 'input_select' %}\n  {% set details = details
          + ['options=' ~ s.attributes.get('options', []) | join(', ')] %}\n{% elif
          domain == 'input_datetime' %}\n  {% set details = details + ['has_date='
          ~ s.attributes.get('has_date', 'false'), 'has_time=' ~ s.attributes.get('has_time',
          'false')] %}\n{% elif domain == 'timer' %}\n  {% set details = details +
          ['duration=' ~ s.attributes.get('duration', 'none')] %}\n{% elif domain
          == 'counter' %}\n  {% set details = details + ['min=' ~ s.attributes.get('min',
          'none'), 'max=' ~ s.attributes.get('max', 'none')] %}\n{% endif %}\n| `{{
          s.entity_id }}` | **{{ s.name | replace(\"'\", \"'\\\\''\") }}** | {{ s.state
          | replace(\"'\", \"'\\\\''\") }} | {{ details | join(', ') | replace(\"'\",
          \"'\\\\''\") }} |\n{% endfor %}\n\n{% endif %}\n{% endfor %}\n\n---\n\n##
          \U0001F3E0 All Entities (By Domain)\n{% for domain, items in states | groupby('domain')
          %}\n{% if domain not in helpers and domain != 'group' %}\n<details><summary><b>{{
          domain | title }} ({{ items | length }})</b></summary>\n\n| Entity ID |
          Name | State |\n|---|---|---|\n{% for s in items | sort(attribute='entity_id')
          %}\n| `{{ s.entity_id }}` | {{ s.name | replace(\"'\", \"'\\\\''\") }} |
          {{ s.state | replace(\"'\", \"'\\\\''\") }} |\n{% endfor %}\n</details>\n\n{%
          endif %}\n{% endfor %}\n"
    - action: shell_command.perform_ha_backup_tasks
      response_variable: backup_result
      data: {}
    - choose:
      - alias: GitHub push failed
        conditions:
        - condition: template
          value_template: '{{ backup_result.returncode != 0 }}'
          alias: GitHub push failed
        sequence:
        - action: system_log.write
          data:
            level: error
            logger: github_backup
            message: 'GitHub backup failed.


              Return code: {{ backup_result.returncode | default(''unknown'') }}


              STDOUT:

              {{ backup_result.stdout | default(''No stdout returned'') }}


              STDERR:

              {{ backup_result.stderr | default(''No stderr returned'') }}'
          metadata: {}
        - action: logbook.log
          data:
            name: GitHub Backup
            message: GitHub backup failed. See System Logs for details.
            entity_id: script.push_ha_info_to_github_create_ai_zip_file_now
          metadata: {}
        - action: notify.mobile_app_blakes_iphone
          data:
            title: GitHub Backup Failed
            message: GitHub backup failed. Check the Home Assistant system logs for
              more information.
          metadata: {}
      - alias: Manual backup succeeded
        conditions:
        - condition: template
          value_template: '{{ context.user_id is not none }}'
          alias: If triggered manually
        sequence:
        - action: notify.mobile_app_blakes_iphone
          data:
            title: Backup Complete
            message: GitHub updated & ZIP ready. Tap to download.
            data:
              shortcut:
                name: Download HA Backup
                input: text
                text: https://esvmza4k2wcpqrmd4otjzifxw6rwdzji.ui.nabu.casa/local/ha_ai_context.zip?v={{
                  now().timestamp() | int }}
                ignore_result: ignore
          metadata: {}
          enabled: false
        - action: notify.blake_foster30_gmail_com
          metadata: {}
          data:
            title: HA ZIP READY
            message: HA ZIP READY
            target: blake.foster30@gmail.com
      default:
      - action: shell_command.delete_ha_ai_zip
        data: {}
        metadata: {}
alexa_music:
  alias: Alexa Music
  description: ''
  trace:
    stored_traces: 10
  sequence:
  - alias: Define Variables
    variables:
      is_search: '{{ action_type | default(''none'') == ''search_music'' }}'
      music_input: "{{ states('input_text.alexa_music_search')\n   if is_search\n
        \  else states('input_text.alarm_music') }}"
      music_query: "{{ music_input\n   if music_input not in ['', 'unknown', 'unavailable']\n
        \  else 'My Soundtrack' }}"
      speaker_selection: "{{ states('input_select.speakers')\n   if is_search\n   else
        'All Echo Group' }}"
      speaker_choice: "{{ speaker_selection\n   if speaker_selection not in ['', 'unknown',
        'unavailable']\n   else 'All Echo Group' }}"
      speaker_voice_name: '{% set clean = speaker_choice.split('' ('')[0] %} {{ (''All
        Echo Group'' if clean | lower == ''default'' else clean) | trim }}'
      target_media_player: "{% set mapper = {\n  'All Echo Group': 'media_player.all_echo_2',\n
        \ 'Echo Dot': 'media_player.blake_s_echo_dot_2',\n  'Echo Pop': 'media_player.blake_s_echo_pop_2',\n
        \ 'Echo Spot': 'media_player.blake_s_echo_spot_2'\n} %} {{ mapper.get(speaker_voice_name,
        'media_player.all_echo_2') }}"
      music_script_variables: "{% if action_type | default('none') == 'stop' %}\n
        \ Stop / Reset\n{% else %}\n  {{ ('Manual Search' if is_search else 'Automatic')\n
        \    ~ ' • '\n     ~ ('Music Search: ' if is_search else 'Alarm Music: ')\n
        \    ~ ('Default: ' if music_input in ['', 'unknown', 'unavailable'] else
        '')\n     ~ music_query\n     ~ ' on '\n     ~ ('Default: ' if speaker_selection
        in ['', 'unknown', 'unavailable'] else '')\n     ~ speaker_voice_name }}\n{%
        endif %}"
    note: is_search decides whether this run is a manual music search or the automatic
      alarm/wakeup path. music_query and speaker_choice provide safe defaults. speaker_voice_name
      is the friendly Alexa command name, target_media_player is the mapped Home Assistant
      media player, and music_script_variables is the primary information written
      before " || " in input_text.music_script_info.
  - choose:
    - alias: Stop Music & Reset
      conditions:
      - alias: 'Action type: stop'
        condition: template
        value_template: '{{ action_type | default(''none'') == ''stop'' }}'
        note: 'Script turns on the music flag toggle. Anything that turns it off triggers
          the helper automation, which ends the script and restarts it with action_type:
          stop to reset for the next use.'
      sequence:
      - alias: Music Off & Reset Echo's
        sequence:
        - alias: 'Music script info: stop all echo devices'
          action: input_text.set_value
          metadata: {}
          target:
            entity_id: input_text.music_script_info
          data:
            value: '{{ music_script_variables }} || Stop media on Every Echo Device'
        - repeat:
            until:
            - condition: template
              value_template: "{% set alexa_devices = [\n  'media_player.blake_s_echo_dot_2',\n
                \ 'media_player.all_echo_2',\n  'media_player.blake_s_echo_pop_2',\n
                \ 'media_player.blake_s_echo_spot_2'\n] %} {{ not (\n  expand(alexa_devices)\n
                \ | map(attribute='state')\n  | select('eq', 'playing')\n  | list\n
                \ | count > 0\n) }}"
            sequence:
            - action: media_player.media_stop
              metadata: {}
              target:
                entity_id:
                - media_player.all_echo_2
                - media_player.blake_s_echo_dot_2
                - media_player.blake_s_echo_pop_2
                - media_player.blake_s_echo_spot_2
              data: {}
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 0
        - alias: 'Music script info: resetting selections'
          action: input_text.set_value
          metadata: {}
          target:
            entity_id: input_text.music_script_info
          data:
            value: '{{ music_script_variables }} || Resetting Selections'
        - action: input_text.set_value
          metadata: {}
          target:
            entity_id: input_text.alexa_music_search
          data:
            value: ''
        - action: input_select.select_option
          metadata: {}
          target:
            entity_id: input_select.speakers
          data:
            option: All Echo (All Alexa Devices)
        - delay:
            hours: 0
            minutes: 0
            seconds: 3
            milliseconds: 0
        - alias: 'Music script info: resetting echo volume'
          action: input_text.set_value
          metadata: {}
          target:
            entity_id: input_text.music_script_info
          data:
            value: '{{ music_script_variables }} || Reset All Echo Volume - 0.3'
        - action: media_player.volume_set
          metadata: {}
          target:
            entity_id: media_player.all_echo_2
          data:
            volume_level: 0.3
        - action: input_text.set_value
          metadata: {}
          target:
            entity_id: input_text.music_script_info
          data:
            value: ''
    default:
    - alias: Normal Sequence
      sequence:
      - parallel:
        - alias: Disable toggle trigger sequence
          sequence:
          - action: input_boolean.turn_on
            metadata: {}
            target:
              entity_id: input_boolean.disable_toggle
            data: {}
          - wait_for_trigger:
            - alias: Button 4 - Single
              trigger: event
              event_type: zha_event
              id: button_4_single
              event_data:
                device_ieee: c0:2c:ed:ff:fe:41:e1:25
                endpoint_id: 2
                cluster_id: 6
                command: 'off'
            - alias: Door - Leaving Logic
              trigger: template
              value_template: "{{ is_state('binary_sensor.front_door', 'on')\n   and
                is_state('binary_sensor.kitchen_presence', 'on')\n   and as_timestamp(\n
                \    states.binary_sensor.kitchen_presence.last_changed\n   ) < as_timestamp(\n
                \    states.binary_sensor.front_door.last_changed\n   ) }}"
            - trigger: state
              entity_id:
              - sensor.recent_alexa
              to:
              - none
              for:
                hours: 0
                minutes: 2
                seconds: 0
            - trigger: switch.turned_off
              target:
                entity_id: input_boolean.disable_toggle
              options: {}
          - action: input_boolean.turn_off
            metadata: {}
            target:
              entity_id: input_boolean.disable_toggle
            data: {}
        - alias: Script actions
          sequence:
          - alias: 'Action type not: disable trigger'
            condition: template
            value_template: '{{ action_type | default(''none'') != ''disable trigger''
              }}'
            note: 'action_type: disable trigger is used only to run the portion of
              the script that turns on the flag and waits for a trigger to turn it
              off and reset.'
          - alias: Variables
            sequence:
            - alias: Log Variables
              action: logbook.log
              metadata: {}
              data:
                message: action_type={{ action_type | default('undefined') }} | is_search={{
                  is_search }} | alexa_music_search={{ states('input_text.alexa_music_search')
                  }} | alarm_music={{ states('input_text.alarm_music') }} | speakers={{
                  states('input_select.speakers') }} | music_input={{ music_input
                  }} | music_query={{ music_query }} | speaker_selection={{ speaker_selection
                  }} | speaker_voice_name={{ speaker_voice_name }} | target_media_player={{
                  target_media_player }}
                name: Music Script Variables
                entity_id: script.alexa_music
            - alias: Initial Music Script Info
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Starting Music Script'
          - alias: Play Music
            sequence:
            - alias: 'Music script info: set starting volume'
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Set Echo Spot & All Echo Volume
                  - 0.0'
            - action: media_player.volume_set
              metadata: {}
              data:
                volume_level: 0
              target:
                entity_id:
                - media_player.blake_s_echo_spot_2
                - media_player.all_echo_2
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 0
            - alias: 'Music script info: Alexa command'
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Command Alexa: Shuffle {{
                  music_query }} on {{ speaker_voice_name }}'
            - action: alexa_devices.send_text_command
              metadata: {}
              data:
                device_id: ba7e4aed08d0947fa03068f398842568
                text_command: Shuffle {{ music_query }} on {{ speaker_voice_name }}
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 500
            - action: media_player.volume_set
              metadata: {}
              data:
                volume_level: 0
              target:
                entity_id:
                - media_player.blake_s_echo_spot_2
                - media_player.all_echo_2
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 0
            - alias: 'Music script info: shuffle'
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Shuffle - {{ speaker_voice_name
                  }}'
            - action: media_player.shuffle_set
              metadata: {}
              data:
                shuffle: true
              target:
                entity_id: '{{ target_media_player }}'
              continue_on_error: true
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 0
            - alias: 'Music script info: skip track'
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Skip Track - {{ speaker_voice_name
                  }}'
            - action: media_player.media_next_track
              metadata: {}
              data: {}
              target:
                entity_id: '{{ target_media_player }}'
            - delay:
                hours: 0
                minutes: 0
                seconds: 3
                milliseconds: 0
            - action: media_player.media_next_track
              metadata: {}
              data: {}
              target:
                entity_id: '{{ target_media_player }}'
            - alias: Volume Up
              repeat:
                count: 7
                sequence:
                - action: input_text.set_value
                  metadata: {}
                  target:
                    entity_id: input_text.music_script_info
                  data:
                    value: '{{ music_script_variables }} || Raising All Echo Volume
                      - {{ repeat.index * 0.02 }}'
                - action: media_player.volume_set
                  metadata: {}
                  data:
                    volume_level: '{{ repeat.index * 0.02 }}'
                  target:
                    entity_id: media_player.all_echo_2
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 2
                    milliseconds: 0
            - alias: 'Music script info: playing'
              action: input_text.set_value
              metadata: {}
              target:
                entity_id: input_text.music_script_info
              data:
                value: '{{ music_script_variables }} || Playing...'
          - alias: Wakeup Sequence
            choose:
            - alias: 'Manual Wakeup: no delays'
              conditions:
              - alias: Action type manual wakeup
                condition: template
                value_template: '{{ action_type | default(''none'') == ''manual wakeup''
                  }}'
                note: 'Workday wakeup automation triggered by button 1 turns on the
                  script with action_type: manual wakeup to bypass delays.'
              sequence:
              - action: light.turn_on
                metadata: {}
                data:
                  transition: 15
                target:
                  entity_id: light.bedroom_lamp
              - action: fan.turn_off
                metadata: {}
                target:
                  entity_id: fan.bedroom_fan
                data: {}
              - action: light.turn_on
                metadata: {}
                target:
                  entity_id: light.bedroom_ceiling_lights
                data: {}
            - alias: Delayed Wakeup
              conditions:
              - alias: Action type not search music
                condition: template
                value_template: '{{ action_type | default(''none'') != ''search_music''
                  }}'
              sequence:
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 10
                  milliseconds: 0
              - action: light.turn_on
                metadata: {}
                data:
                  transition: 15
                target:
                  entity_id: light.bedroom_lamp
              - delay:
                  hours: 0
                  minutes: 2
                  seconds: 0
                  milliseconds: 0
              - action: fan.turn_off
                metadata: {}
                target:
                  entity_id: fan.bedroom_fan
                data: {}
              - delay:
                  hours: 0
                  minutes: 2
                  seconds: 0
                  milliseconds: 0
              - action: light.turn_on
                metadata: {}
                target:
                  entity_id: light.bedroom_ceiling_lights
                data: {}
set_my_room:
  alias: Set My Room
  description: Optimized room setup with Visual Editor formatting
  mode: single
  sequence:
  - action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.lights_off_except_bedroom
  - alias: Lamp Check
    if:
    - condition: state
      entity_id: light.bedroom_lamp
      state: 'on'
    then: []
    else:
    - if:
      - condition: template
        value_template: "{{ \n  is_state('fan.bedroom_fan', 'on') and\n  is_state('light.main_lights',
          'off') and\n  is_state('light.bedroom_ceiling_lights', 'off') and\n  is_state('light.bathroom_light',
          'off') and\n  is_state('media_player.bedroom_tv', 'off') and\n  is_state('light.bedroom_lamp',
          'off') and\n  is_state('light.closet_light', 'off') and\n  is_state('fan.living_room_ceiling_fan',
          'off') and\n  is_state('light.living_room_ceiling_lights', 'off') and\n
          \ is_state('light.kitchen_lights', 'off') and\n  is_state('light.bedroom_tv_backlight',
          'off')\n}}\n"
      - condition: time
        after: '23:00:00'
        before: 07:00:00
      then:
      - action: scene.turn_on
        metadata: {}
        target:
          entity_id: scene.dimmed
        data: {}
      else:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.full_lamp
      alias: 'Dimmed lamp if Goodnight = active & after 11pm '
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: light.bedroom_ceiling_lights
  - action: fan.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: fan.bedroom_fan
  - alias: TV Check
    if:
    - condition: state
      entity_id: media_player.bedroom_tv
      state: 'on'
    then: []
    else:
    - action: media_player.turn_on
      metadata: {}
      target:
        entity_id: media_player.bedroom_tv
      data: {}
    - delay:
        hours: 0
        minutes: 0
        seconds: 5
        milliseconds: 0
    - action: media_player.play_media
      metadata: {}
      target:
        entity_id: media_player.bedroom_tv
      data:
        media:
          media_content_id: '837'
          media_content_type: app
          metadata:
            title: YouTube
            thumbnail: http://192.168.1.68:8060/query/icon/837
            media_class: app
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: apps
              media_content_id: ''
            browse_entity_id: media_player.bedroom_tv
helper_script:
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''abort'' }}'
        alias: 'Action_type: abort'
      sequence:
      - action: automation.turn_off
        metadata: {}
        target:
          entity_id: automation.workday_wakeup
        data:
          stop_actions: true
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.workday_wakeup
        data: {}
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.workday_wakeup
        data:
          skip_condition: true
          variables:
            action_type: abort
      alias: Workday wakeup abort
    - conditions:
      - alias: 'Action_type: lights'
        condition: template
        value_template: '{{ action_type == ''lights'' }}'
        enabled: true
      sequence:
      - variables:
          caller_config:
            automation.light_automations:
              default:
                sensors:
                - binary_sensor.bathroom_presence
                - binary_sensor.closet_motion
                - binary_sensor.kitchen_presence
                - binary_sensor.living_room_motion
                threshold: 5
                timer_duration: 00:05:00
            automation.door_automation:
              arriving:
                sensors:
                - binary_sensor.kitchen_presence
                - binary_sensor.living_room_motion
                threshold: 2
                timer_duration: 00:02:00
              leaving:
                sensors:
                - binary_sensor.apartment_presence
                threshold: 5
                timer_duration: 00:05:00
        enabled: true
      - variables:
          profile: '{{ caller_branch | default(''default'') }}'
          sensors: '{{ caller_config[called_by][profile][''sensors''] }}'
          threshold: '{{ caller_config[called_by][profile][''threshold''] }}'
          timer_duration: '{{ caller_config[called_by][profile][''timer_duration'']
            }}'
        enabled: true
      - if:
        - condition: light.is_on
          target:
            entity_id:
            - light.main_lights
            - light.kitchen_lights
            - light.living_room_ceiling_lights
            - light.bedroom_ceiling_lights
          options:
            for: 00:00:00
            behavior: any
        then:
        - if:
          - condition: template
            value_template: '{{ is_state(''script.temporary_thermostat_adjustment'',
              ''on'') }}

              '
            alias: Temporary Thermostat Adjustment is active
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.template_tracking
            metadata: {}
            data:
              value: Timer was already active when triggered
          - wait_template: '{{ state_attr(called_by, ''current'') | int(0) == 0 }}

              '
            continue_on_timeout: false
            alias: Waits for triggering automation to complete
          - action: input_text.set_value
            target:
              entity_id: input_text.template_tracking
            metadata: {}
            data:
              value: ''
          else:
          - action: input_text.set_value
            target:
              entity_id: input_text.template_tracking
            metadata: {}
            data:
              value: '{{ state_attr(called_by, ''friendly_name'') }} {{ ''- '' ~ profile
                if profile != ''default'' else '''' }}'
          - repeat:
              until:
              - alias: Dynamic sensor list off for set time
                condition: template
                value_template: "{% set entities = expand(sensors) %}\n{% set any_on
                  =\n  entities\n  | selectattr('state', 'eq', 'on')\n  | list\n  |
                  count > 0\n%}\n{% set any_recent =\n  entities\n  | selectattr(\n
                  \     'last_changed',\n      'ge',\n      now() - timedelta(minutes=threshold
                  | int)\n    )\n  | list\n  | count > 0\n%}\n{{ not any_on and not
                  any_recent }}\n"
              sequence:
              - alias: Any relevant sensor is on IF BLOCK
                if:
                - alias: Dynamic sensor list = on
                  condition: template
                  value_template: "{{ expand(sensors)\n  | selectattr('state', 'eq',
                    'on')\n  | list\n  | count > 0 }}\n"
                then:
                - action: timer.pause
                  metadata: {}
                  target:
                    entity_id: timer.timer_helper
                  data: {}
                - alias: Dynamic sensor list = clear
                  wait_template: "{{ expand(sensors)\n  | selectattr('state', 'eq',
                    'on')\n  | list\n  | count == 0 }}\n"
                  continue_on_timeout: false
                else:
                - action: timer.start
                  metadata: {}
                  target:
                    entity_id: timer.timer_helper
                  data:
                    duration: '{{ timer_duration }}'
                - alias: Relevant sensors -> detected OR timer finishes
                  wait_for_trigger:
                  - trigger: template
                    value_template: "{{ expand(sensors)\n  | selectattr('state', 'eq',
                      'on')\n  | list\n  | count > 0 }}\n"
                    alias: Dynamic sensor list -> detected
                  - trigger: timer.finished
                    target:
                      entity_id: timer.timer_helper
                    options:
                      for: 00:00:00
          - action: input_text.set_value
            metadata: {}
            target:
              entity_id: input_text.template_tracking
            data:
              value: ''
      alias: Lights -> dashboard timer sequence
  alias: Helper script
  description: ''
  mode: restart
  trace:
    stored_traces: 10
