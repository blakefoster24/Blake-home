        - action: button.press
          metadata: {}
          target:
            entity_id: button.blake_foster30_gmail_com_set_backlight_late_for_work
          data: {}
        - repeat:
            while:
            - condition: state
              entity_id: binary_sensor.bed_presence_bb8594_bed_occupied_left
