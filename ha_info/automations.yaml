- id: '1758990657332'
  alias: Living Room Lamp
  description: Control the living room lamp around sunset/sunrise and in sync with
    the main lights.
  triggers:
  - trigger: sun
    event: sunset
    offset: -01:00:00
    id: Sunset -1hr
    enabled: true
    alias: Sunset
  - trigger: sun
    event: sunrise
    offset: 00:30:00
    id: Sunrise +30min
    alias: Sunrise
  - type: value
    device_id: c01df91d71e0dd72fe7a5636aea2d71b
    entity_id: 43e53695c8962aaa2bf07e8ed7325df8
    domain: sensor
    trigger: device
    above: 40
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Cloud coverage >40
    alias: Clouds > 40%
  - type: value
    device_id: c01df91d71e0dd72fe7a5636aea2d71b
    entity_id: 43e53695c8962aaa2bf07e8ed7325df8
    domain: sensor
    trigger: device
    below: 30
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Cloud coverage <30
    alias: Clouds < 30%
  - trigger: state
    entity_id:
    - person.blake_foster
    to: home
    id: Blake’s home
  - trigger: state
    entity_id:
    - person.blake_foster
    to: not_home
    id: Blake away
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Cloud coverage >40
        - Sunset -1hr
        - Blake’s home
        alias: 'Triggered By: Sunset or Cloudy or Home'
      - condition: light.is_off
        target:
          entity_id: light.living_room_lamp
        options:
          for: 00:00:00
      - alias: Sundown or Cloudy & Home
        condition: or
        conditions:
        - condition: sun
          before: sunrise
          after: sunset
          after_offset: -01:00:00
          before_offset: 00:30:00
          alias: Sundown
        - alias: Cloudy & Home
          condition: and
          conditions:
          - type: is_value
            condition: device
            device_id: c01df91d71e0dd72fe7a5636aea2d71b
            entity_id: 43e53695c8962aaa2bf07e8ed7325df8
            domain: sensor
            above: 38
            alias: Clouds > 38%
          - condition: state
            entity_id: person.blake_foster
            state: home
      sequence:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 75
          transition: 0
        target:
          entity_id: light.living_room_lamp
      alias: Turn On Branch
    - conditions:
      - condition: trigger
        id:
        - Cloud coverage <30
        - Sunrise +30min
        - Blake away
        alias: 'Triggered By: Sunrise or Sunny or Away'
      - condition: light.is_on
        target:
          entity_id: light.living_room_lamp
        options:
          for: 00:00:00
      - condition: not
        conditions:
        - alias: Sundown
          condition: sun
          before: sunrise
          after: sunset
          before_offset: 00:30:00
          after_offset:
            hours: -1
            minutes: 0
            seconds: 0
      - condition: or
        conditions:
        - type: is_value
          condition: device
          device_id: c01df91d71e0dd72fe7a5636aea2d71b
          entity_id: 43e53695c8962aaa2bf07e8ed7325df8
          domain: sensor
          below: 32
          alias: Clouds < 32%
        - condition: state
          entity_id: person.blake_foster
          state: not_home
        alias: Sunny or Away
      sequence:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.living_room_lamp
      alias: Turn off Branch
  trace:
    stored_traces: 50
  mode: single
- id: nightly_github_sync
  alias: Nightly GitHub sync
  description: Run snapshots + push every night at 2 AM
  triggers:
  - trigger: time
    at: 02:00:00
  actions:
  - action: script.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: script.push_ha_info_to_github_create_ai_zip_file_now
  mode: single
- id: '1759838752481'
  alias: Light Automations
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - light.bedroom_ceiling_lights
    id: Bedroom ceiling lights
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.bed_presence_bb8594_bed_occupied_left
    id: Bed left
    to:
    - 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - trigger: state
    entity_id:
    - binary_sensor.closet_motion
    id: Closet motion
  - trigger: state
    entity_id:
    - binary_sensor.bathroom_presence
    id: 'Bathroom presence '
    to:
    - 'on'
  - trigger: motion.detected
    target:
      entity_id: binary_sensor.living_room_motion
    options:
      for: 00:00:00
    id: 'Motion '
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.kitchen_presence
    options:
      for: 00:00:00
    id: Kitchen presence
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Bedroom ceiling lights
      sequence:
      - alias: Lamp on / set room script
        parallel:
        - alias: ceiling lights on -> lamp on
          sequence:
          - wait_for_trigger:
            - trigger: state
              entity_id:
              - light.bedroom_ceiling_lights
              to:
              - 'on'
              for:
                hours: 0
                minutes: 0
                seconds: 2
            timeout:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
            continue_on_timeout: false
          - action: scene.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: scene.full_lamp
        - alias: Ceiling lights toggle (3) -> set room
          sequence:
          - wait_for_trigger:
            - trigger: state
              entity_id:
              - light.bedroom_ceiling_lights
            timeout:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
            continue_on_timeout: false
          - wait_for_trigger:
            - trigger: state
              entity_id:
              - light.bedroom_ceiling_lights
            timeout:
              hours: 0
              minutes: 0
              seconds: 5
              milliseconds: 0
            continue_on_timeout: false
          - action: script.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: script.set_my_room
      alias: Ceiling Light = lamp or set room
    - conditions:
      - condition: trigger
        id:
        - Bed left
      sequence:
      - sequence:
        - parallel:
          - alias: Occupancy not detected outside bedroom for 5min
            wait_template: "{% set sensors = [\n  'binary_sensor.bathroom_presence',\n
              \ 'binary_sensor.closet_motion',\n  'binary_sensor.kitchen_presence',\n
              \ 'binary_sensor.living_room_motion'\n] %}\n{% set threshold = 5 %}\n{#
              1. Expand the sensor list once to save resources #}\n{% set entities
              = expand(sensors) %}\n\n{# 2. Check for any 'on' states or changes within
              the threshold #}\n{% set any_on = entities | selectattr('state', 'eq',
              'on') | list | count > 0 %}\n{% set any_recent = entities | selectattr('last_changed',
              'ge', now() - timedelta(minutes=threshold)) | list | count > 0 %}\n\n{#
              3. Return true only if nothing is 'on' AND nothing changed recently
              #}\n{{ not any_on and not any_recent }}\n"
            continue_on_timeout: false
            timeout:
              hours: 0
              minutes: 20
              seconds: 0
              milliseconds: 0
          - action: script.turn_on
            target:
              entity_id: script.helper_script
            metadata: {}
            data:
              variables:
                action_type: lights
                called_by: '{{ this.entity_id }}'
        - action: scene.turn_on
          metadata: {}
          target:
            entity_id: scene.lights_off_except_bedroom
          data: {}
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.bedroom_ceiling_lights
          data: {}
    - conditions:
      - condition: trigger
        id:
        - Closet motion
      sequence:
      - alias: Motion detected / motion clears
        if:
        - condition: state
          entity_id: binary_sensor.closet_motion
          state:
          - 'on'
        then:
        - if:
          - condition: state
            entity_id: binary_sensor.bed_presence_bb8594_bed_occupied_either
            state:
            - 'on'
          then:
          - delay:
              hours: 0
              minutes: 0
              seconds: 2
              milliseconds: 0
          - action: light.turn_on
            metadata: {}
            target:
              entity_id: light.closet_light
            data: {}
          else:
          - action: light.turn_on
            metadata: {}
            target:
              entity_id: light.closet_light
            data: {}
          alias: Check bed occupied right -> delay light if occupied
          note: Delay 2 seconds to provide time to close closet door so light doesn’t
            bother person still in bed
        else:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.closet_light
          data: {}
    - conditions:
      - condition: trigger
        id:
        - 'Bathroom presence '
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.bathroom_light
        data: {}
      - alias: Bathroom presence off > 30s
        wait_template: "{{ is_state('binary_sensor.bathroom_presence', 'off')\n   and
          (now() - states.binary_sensor.bathroom_presence.last_changed).total_seconds()
          >= 30 }}"
        continue_on_timeout: true
        timeout:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      - alias: Humidity if/then
        if:
        - condition: numeric_state
          entity_id: sensor.bathroom_humidity_derivative
          above: 1
        then:
        - wait_for_trigger:
          - trigger: numeric_state
            entity_id:
            - sensor.bathroom_humidity_derivative
            for:
              hours: 0
              minutes: 2
              seconds: 0
            below: -0.5
          continue_on_timeout: false
        - alias: Bathroom presence off > 30s
          wait_template: "{{ is_state('binary_sensor.bathroom_presence', 'off')\n
            \  and (now() - states.binary_sensor.bathroom_presence.last_changed).total_seconds()
            >= 30 }}"
          continue_on_timeout: true
          timeout:
            hours: 0
            minutes: 30
            seconds: 0
            milliseconds: 0
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.bathroom_light
          data: {}
        else:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.bathroom_light
          data: {}
  mode: parallel
  trace:
    stored_traces: 30
  max: 10
- id: '1760424497591'
  alias: Thermostat
  description: ''
  triggers:
  - alias: A temperature >. 71
    trigger: temperature.crossed_threshold
    target:
      entity_id: climate.nest_thermostat
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 70
          unit_of_measurement: °F
      for:
        hours: 0
        minutes: 10
        seconds: 0
    id: Above > 70 10m
  - alias: Temperature ~ 67
    trigger: temperature.crossed_threshold
    target:
      entity_id: climate.nest_thermostat
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 67
          unit_of_measurement: °F
      for:
        hours: 0
        minutes: 10
        seconds: 0
    id: Below< 68 10m
  - trigger: zone.left
    target:
      entity_id: person.blake_foster
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
    id: Blake away
  - trigger: zone.entered
    target:
      entity_id: person.blake_foster
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
    id: Blake’s home
  - trigger: time
    at: '16:00:00'
    id: Afternoon Time Window
  - alias: 64 > Thermostat Temperature > 76
    trigger: template
    value_template: "{{ states('sensor.nest_thermostat_temperature') | float > 76
      \n   or states('sensor.nest_thermostat_temperature') | float < 64 }}\n"
    id: 64 > Thermostat Temperature > 76
  - alias: Temperature > 5* from Setpoint
    trigger: template
    value_template: "{% set current = states('sensor.nest_thermostat_temperature')
      | float(0) %}\n{% set target = state_attr('climate.nest_thermostat', 'temperature')
      %}\n{% set high = state_attr('climate.nest_thermostat', 'target_temp_high')
      %}\n{% set low = state_attr('climate.nest_thermostat', 'target_temp_low') %}\n\n{{
      (target is not none and (current - target) | abs > 5)\n   or (high is not none
      and low is not none and (current > high + 5 or current < low - 5)) }}\n"
    id: Set-point discrepancy
    for:
      hours: 0
      minutes: 20
      seconds: 0
  - trigger: time
    at: 08:00:00
    id: 8am
  - trigger: time
    at: '23:00:00'
    id: 11pm
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.thermostat_automation_pause
      state:
      - 'off'
    - condition: trigger
      id:
      - Set-point discrepancy
      - 64 > Thermostat Temperature > 76
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Above > 70 10m
      - condition: not
        conditions:
        - alias: Home + workday + 9-4
          condition: and
          conditions:
          - condition: switch.is_on
            target:
              entity_id: input_boolean.workday_today_toggle
            options: {}
          - condition: time
            after: 06:00:30
            before: '15:50:00'
          - condition: zone.not_in_zone
            target:
              entity_id: person.blake_foster
            options:
              behavior: any
              for: 00:00:00
              zone: zone.home
      sequence:
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.nest_thermostat
        data:
          temperature: 68
          hvac_mode: cool
    - conditions:
      - condition: trigger
        id:
        - Below< 68 10m
      - condition: not
        conditions:
        - alias: Home + workday + 9-4
          condition: and
          conditions:
          - condition: zone.not_in_zone
            target:
              entity_id: person.blake_foster
            options:
              behavior: any
              for: 00:00:00
              zone: zone.home
          - condition: switch.is_on
            target:
              entity_id: input_boolean.workday_today_toggle
            options: {}
          - condition: time
            after: 09:00:00
            before: '15:50:00'
      sequence:
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.nest_thermostat
        data:
          temperature: 68
          hvac_mode: heat
    - conditions:
      - condition: trigger
        id:
        - Blake away
      - condition: state
        entity_id: input_boolean.workday_today_toggle
        state: 'on'
      - condition: time
        after: 08:40:00
        before: '15:50:00'
      sequence:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.thermostat_away
      alias: Away Branch
    - conditions:
      - condition: trigger
        id:
        - Blake’s home
      - condition: switch.is_on
        target:
          entity_id: input_boolean.workday_today_toggle
        options: {}
      - condition: time
        after: 08:59:00
        before: '15:50:00'
      sequence:
      - if:
        - condition: temperature.is_value
          target:
            entity_id: sensor.openweathermap_feels_like_temperature_2
          options:
            threshold:
              type: above
              value:
                active_choice: number
                number: 70
                unit_of_measurement: °F
        then:
        - action: climate.set_temperature
          metadata: {}
          target:
            entity_id: climate.nest_thermostat
          data:
            temperature: 68
            hvac_mode: cool
        else:
        - action: climate.set_temperature
          metadata: {}
          target:
            entity_id: climate.nest_thermostat
          data:
            temperature: 68
            hvac_mode: heat
      alias: Blake home during workday
    - conditions:
      - condition: trigger
        id:
        - 64 > Thermostat Temperature > 76
        - Set-point discrepancy
      sequence:
      - choose:
        - conditions:
          - condition: trigger
            id:
            - 64 > Thermostat Temperature > 76
          - condition: state
            entity_id: person.blake_foster
            state:
            - home
          sequence:
          - action: scene.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: scene.thermostat_ideal_evening
        - conditions:
          - condition: trigger
            id:
            - Set-point discrepancy
          sequence:
          - action: notify.mobile_app_blakes_iphone
            metadata: {}
            data:
              message: 'Current temperature is: {{ state_attr("climate.nest_thermostat",
                "current_temperature") }}°

                Set on: {{ states(''climate.nest_thermostat'') ~ '' - '' ~

                state_attr(''climate.nest_thermostat'', ''temperature'') }}°

                '
              data:
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 0.5
              title: Thermostat Discrepancy
      alias: Temperature Issue
    - conditions:
      - condition: trigger
        id:
        - Afternoon Time Window
      - alias: Home + workday + 9-4
        condition: and
        conditions:
        - condition: switch.is_on
          target:
            entity_id: input_boolean.workday_today_toggle
          options: {}
        - condition: zone.not_in_zone
          target:
            entity_id: person.blake_foster
          options:
            behavior: any
            for: 00:00:00
            zone: zone.home
      sequence:
      - if:
        - condition: temperature.is_value
          target:
            entity_id: weather.openweathermap_2
          options:
            threshold:
              type: above
              value:
                active_choice: number
                unit_of_measurement: °F
                number: 70
        then:
        - action: climate.set_temperature
          metadata: {}
          target:
            entity_id: climate.nest_thermostat
          data:
            temperature: 68
            hvac_mode: cool
        else:
        - action: climate.set_temperature
          metadata: {}
          target:
            entity_id: climate.nest_thermostat
          data:
            temperature: 68
            hvac_mode: heat
    - conditions:
      - condition: trigger
        id:
        - 8am
      - condition: state
        entity_id: input_boolean.workday_today_toggle
        state: 'on'
      - condition: zone.in_zone
        target:
          entity_id: person.blake_foster
        options:
          behavior: any
          for: 00:00:00
          zone: zone.home
      sequence:
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.nest_thermostat
        data:
          temperature: 70
          hvac_mode: heat
    - conditions:
      - condition: trigger
        id:
        - 11pm
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.thermostat_automation_pause
        data: {}
        enabled: true
      alias: Reset thermostat pause toggle
    continue_on_error: true
    enabled: true
  trace:
    stored_traces: 50
  mode: single
- id: '1761198863619'
  alias: Helper Automation
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.blake_foster
    to:
    - home
    id: Blake Home
  - trigger: state
    entity_id:
    - binary_sensor.front_door
    to:
    - 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: Stuck open
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.dashboard_toggle
    options:
      behavior: each
      for:
        hours: 0
        minutes: 5
        seconds: 0
    id: Dashboard toggle on 5min
  - trigger: switch.turned_off
    target:
      entity_id: input_boolean.disable_toggle
    options:
      behavior: each
      for: 00:00:00
    id: Music disable = Off
  - trigger: media_player.started_playing
    target:
      entity_id:
      - media_player.all_echo_2
      - media_player.blake_s_echo_dot_2
      - media_player.blake_s_echo_pop_2
      - media_player.blake_s_echo_spot_2
    options:
      for:
        hours: 0
        minutes: 1
        seconds: 0
      behavior: first
    id: Echos playing > 2min
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Blake Home
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.home_timestamp
        data:
          datetime: '{{ now().isoformat() }}'
        alias: Set Home Timestamp
        metadata: {}
    - conditions:
      - condition: trigger
        id:
        - Stuck open
      sequence:
      - action: notify.mobile_app_blakes_iphone
        metadata: {}
        data:
          message: Front door sensor still open
          data:
            interruption-level: time-sensitive
          title: Door Did Not Close
    - conditions:
      - condition: trigger
        id:
        - Dashboard toggle on 5min
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.dashboard_toggle
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Music disable = Off
        alias: 'Triggered by: music flag - off'
      sequence:
      - action: script.turn_off
        metadata: {}
        target:
          entity_id: script.alexa_music
        data: {}
      - action: script.turn_on
        target:
          entity_id: script.alexa_music
        data:
          variables:
            action_type: stop
        metadata: {}
    - conditions:
      - condition: trigger
        id:
        - Echos playing > 2min
        alias: If triggered by Echos playing > 1min
      - condition: state
        entity_id: script.alexa_music
        state:
        - 'off'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.alexa_music
        data:
          variables:
            action_type: disable trigger
        metadata: {}
      alias: If triggered by Echos playing > 1min and 1 more condition
  mode: parallel
  max: 10
  trace:
    stored_traces: 50
- id: '1761312420129'
  alias: 'Battery Low Automation '
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.blakes_iphone_battery_level
    below: 11
    id: iPhone battery
  - trigger: numeric_state
    entity_id:
    - sensor.ipad_battery_level
    below: 11
    id: iPad battery
  conditions: []
