        metadata: {}
        target:
          entity_id: input_boolean.disable_toggle
        data: {}
    else:
    - alias: Main automation actions
      parallel:
      - alias: Wake Up Scene Sequence
        sequence:
        - action: script.turn_on
          target:
            entity_id: script.alexa_music
          data:
            variables:
              action_type: '{{ trigger.id }}

                '
          note: 'Turns on music script, passes action_type: manual wakeup if automation
            was triggered by button 1'
          metadata: {}
        - action: light.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: light.bathroom_light
        - action: light.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: light.closet_light
        - wait_for_trigger:
          - trigger: time
            at: 08:38:00
        - action: light.turn_on
          metadata: {}
          data:
            rgb_color:
            - 255
            - 73
            - 0
            brightness: 255
          target:
            entity_id: light.bedroom_tv_backlight
        - wait_for_trigger:
          - trigger: time
            at: 08:45:00
        - action: light.turn_on
          metadata: {}
          data:
            rgb_color:
            - 255
            - 0
            - 0
            brightness: 255
          target:
            entity_id: light.bedroom_tv_backlight
        - wait_for_trigger:
          - trigger: time
