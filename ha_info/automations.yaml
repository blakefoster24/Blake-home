- id: '1787939305481'
  alias: Security
  description: ''
  triggers:
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.apartment_presence
    options:
      behavior: each
      for:
        hours: 0
        minutes: 1
        seconds: 0
    id: Apartment presence detected
  - trigger: door.opened
    target:
      entity_id: binary_sensor.front_door
    options:
      behavior: each
      for: 00:00:00
    id: Door opened
    enabled: true
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: DISREGARD_SECURITY_ALERT
    id: Disregard
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Apartment presence detected
        - Door opened
      - condition: zone.not_in_zone
        target:
          entity_id: person.blake_foster
        options:
          behavior: any
          for: 00:00:00
          zone: zone.home
        enabled: true
      sequence:
      - action: notify.mobile_app_blakes_iphone
        metadata: {}
        data:
          title: Security Alert!
          message: '{{ trigger.id }} while not home'
          data:
            interruption-level: time-sensitive
            actions:
            - action: URI
              title: Security Dashboard
              uri: /my-dashboard/security
            - action: DISREGARD_SECURITY_ALERT
              title: Disregard
              destructive: true
      - action: input_text.set_value
        target:
          entity_id:
          - input_text.security_info
        metadata: {}
        data:
          value: '{{ trigger.id }} - {{ as_local(state_attr(this.entity_id, ''last_triggered'')).strftime(''%-I:%M
            %p'') }}'
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - Disregard
        - condition: template
          value_template: '{{ action_type == ''disregard'' }}'
          alias: 'Action_type: disregard'
      sequence:
      - action: input_text.set_value
        target:
          entity_id:
          - input_text.security_info
        data:
          value: ''
        metadata: {}
  mode: queued
  max: 10
